<title id="t-03">MEMHD: array utilization with one versus many centroids per class</title>
<desc id="d-03">Schematic. With one vector per class only a few columns of the IMC array are used, and vectors longer than the array need extra cycles. With multi-centroid class memories every column is used and inference takes one cycle.</desc>
