<svg class="bp" viewBox="0 0 960 540" role="img" aria-labelledby="t-01 d-01" xmlns="http://www.w3.org/2000/svg">
<title id="t-01">HyperSPACE: XOR-binding versus AND-binding</title>
<desc id="d-01">Schematic. With XOR-binding about half of the bound bits are ones, so popcount needs an exact adder tree. With AND-binding and sparsity-tuned projection almost every bit is zero, so a sparse adder tree only sums the few non-zeros.</desc>
