<title id="t-02">DiP-MEMHD: pruning dimensions to fit a compact IMC array</title>
<desc id="d-02">Schematic. A long class hypervector of D dimensions is pruned to D-prime, the number of array rows, using calibration and variance-based weighting. Each class occupies several centroid columns, so the whole compact array is used in one search cycle.</desc>
