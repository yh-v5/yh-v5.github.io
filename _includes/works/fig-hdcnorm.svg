<title id="t-04">HDC normalization: class hypervector norm during online retraining</title>
<desc id="d-04">Schematic after Figure 2 of the paper. Without normalization the L2 norm of class hypervectors grows steadily with epochs, so later updates move the model less. With per-epoch normalization the norm is reset to one after every epoch.</desc>
