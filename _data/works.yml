# Exhibit data for each work, keyed by BibTeX key.
# Citation metadata (title, authors, venue, DOI, abstract) lives in
# _bibliography/papers.bib; this file only holds what the exhibit pages add:
# catalogue number (num; not "no", which YAML reads as false), one-line statement, "medium", figure, and spec sheet.
# List order = catalogue order (01 first), and drives prev/next navigation.

- key: oh2026hyperspace
  num: "01"
  short: HyperSPACE
  venue_short: ISLPED ’26
  status: Published, Poster
  statement: Making hyperdimensional encoding fully compatible with sparse adder trees on digital compute-in-memory arrays.
  medium: AND-binding, sparsity-tuned projection vectors, adaptive binary quantization
  substrate: Digital SRAM-CIM, 128 × 64 arrays
  figure: works/fig-hyperspace.svg
  figure_caption: XOR-binding pins bound-vector sparsity near 0.5, so popcount must run on exact adder trees. AND-binding compounds sparsity past 0.99, which lets the same computation run on sparse adder trees.
  specs:
    - label: Encoding energy
      value: up to 13.03× lower
    - label: Classification accuracy
      value: up to +3.82%
    - label: Bound-vector sparsity
      value: "> 0.99"
    - label: Popcount share of encoding energy (exact adder trees)
      value: up to 89.6%
    - label: Benchmarks
      value: "4"

- key: kang2026dipmemhd
  num: "02"
  short: DiP-MEMHD
  venue_short: IEEE IoT-J
  status: Early Access
  statement: Fitting multi-centroid hyperdimensional classifiers onto compact in-memory computing arrays by pruning dimensions without losing what matters.
  medium: Multi-centroid associative memory, dimension pruning with calibration and variance-based weighting
  substrate: Compact IMC arrays, 64 × 64 and 128 × 128
  figure: works/fig-dipmemhd.svg
  figure_caption: The hypervector dimension D is pruned down to the array height, and each class is spread over several centroid columns, so every row and column of a compact array does work in a single search cycle.
  specs:
    - label: Memory efficiency (MEMHD)
      value: 10.60× at comparable accuracy
    - label: Accuracy at equal memory (MEMHD)
      value: +14.61%
    - label: vs. existing pruning metrics
      value: +2.47% accuracy
    - label: vs. state-of-the-art binary HDC
      value: +22.4% accuracy
    - label: Energy efficiency on compact arrays
      value: 6–8× better

- key: kang2025memhd
  num: "03"
  short: MEMHD
  venue_short: DATE ’25
  status: Published
  statement: Replacing one vector per class with many, so hyperdimensional inference fills an in-memory computing array and finishes in a single cycle.
  medium: Multi-centroid associative memory, clustering-based initialization, quantization-aware iterative learning
  substrate: In-memory computing arrays
  figure: works/fig-memhd.svg
  figure_caption: One class vector per column leaves most of an IMC array idle, and vectors longer than the array need several cycles. Multi-centroid class memories fit the array exactly, so it is fully used and inference takes a single cycle.
  specs:
    - label: Accuracy at equal memory
      value: up to +13.69%
    - label: Memory efficiency
      value: up to 13.25×
    - label: Inference
      value: Single cycle, fully utilized array

- key: oh2024hdcnorm
  num: "04"
  short: HDC Normalization
  venue_short: AISP 2024
  status: Published
  statement: Keeping late training data from fading out of a hyperdimensional model by renormalizing class hypervectors after every epoch.
  medium: Per-epoch L2 normalization of class hypervectors during online retraining
  substrate: TorchHD on NVIDIA TITAN RTX
  figure: works/fig-hdcnorm.svg
  figure_caption: Without normalization, class hypervector norms keep growing during online learning, so each new update moves the model less and less. Resetting every class HV to unit norm after each epoch lets data from every epoch count equally.
  specs:
    - label: Accuracy, 100-D HVs
      value: +2.04% MNIST, +1.54% CIFAR-10
    - label: Accuracy, 10,000-D HVs
      value: +0.67% MNIST, +0.58% CIFAR-10
    - label: Training-time overhead
      value: +1.08%
    - label: Datasets
      value: MNIST, CIFAR-10
